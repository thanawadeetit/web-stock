<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการสต๊อก</title>
    <meta property="og:title" content="ระบบจัดการสต๊อก">
    <meta property="og:description" content="ระบบจัดการสต๊อก">
    <meta property="og:image" content="https://raw.githubusercontent.com/thanawadeetit/test-web/main/logo.png">
    
    <meta property="og:type" content="website">
    <link rel="icon" href="https://raw.githubusercontent.com/thanawadeetit/test-web/main/logo.png" type="image/png">
    
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/thanawadeetit/test-web/main/logo.png">
    <meta name="theme-color" content="#ffffff">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #F4F6F9;
        }
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <iframe id="app-iframe" allow="camera; microphone; autoplay; fullscreen"></iframe>
 
    <script>
        const gasUrl = "https://script.google.com/macros/s/AKfycbxH5X87mjfaLnTwHS7Jv22i6ae1UDxMpP93cu1-_aoJm57DiPdO0Qql1fK-PX_bmDOmbQ/exec";
        const queryString = window.location.search;
        document.getElementById('app-iframe').src = gasUrl + queryString;

        window.addEventListener("message", function(event) {
            try {
                let data = event.data;
                if (typeof data === 'string') { data = JSON.parse(data); }
                if (data && data.type === 'redirect') {
                    const currentUrl = new URL(window.location.href);
                    currentUrl.searchParams.set('page', data.page);
                    window.location.href = currentUrl.toString();
                } 
                else if (data && data.type === 'removeScanParam') {
                    const currentUrl = new URL(window.location.href);
                    currentUrl.searchParams.delete('scan');
                    window.history.replaceState({}, document.title, currentUrl.toString());
                }

            } catch (error) {
                console.error("Redirect Error:", error);
            }
        });
    </script>
</body>
</html>
